services:
  # FastAPI Backend Service
  - type: web
    name: justimind-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: COURTLISTENER_API_KEY
        sync: false

  # Vite Frontend Static Site
  - type: web
    name: justimind-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: justimind-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
